  <div id="sheet-root" class="sheet-root"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-relevant="additions"></div>

  <dialog id="dialog-playlist" class="dialog dialog--form" aria-labelledby="dialog-playlist-title">
    <form id="playlist-form" class="dialog-body" method="dialog">
      <h2 id="dialog-playlist-title" class="dialog-title">New playlist</h2>
      <label class="field">
        <span class="field-label">Name</span>
        <input class="input" name="name" required maxlength="80" autocomplete="off" placeholder="My playlist">
      </label>
      <label class="field">
        <span class="field-label">Description</span>
        <textarea class="input" name="description" rows="3" maxlength="220" placeholder="Optional"></textarea>
      </label>
      <input type="hidden" name="trackKey">
      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" data-dialog-close>Cancel</button>
        <button id="dialog-playlist-submit" class="btn btn-primary" type="submit" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialog-confirm" class="dialog dialog--alert" aria-labelledby="dialog-confirm-title" aria-describedby="dialog-confirm-body">
    <form class="dialog-body" method="dialog">
      <h2 id="dialog-confirm-title" class="dialog-title">Are you sure?</h2>
      <p id="dialog-confirm-body" class="dialog-text"></p>
      <div class="dialog-actions">
        <button class="btn btn-secondary" type="submit" value="cancel" data-dialog-cancel>Cancel</button>
        <button class="btn btn-primary" type="submit" value="confirm" data-dialog-confirm>Continue</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialog-prompt" class="dialog dialog--form" aria-labelledby="dialog-prompt-title">
    <form class="dialog-body" method="dialog">
      <h2 id="dialog-prompt-title" class="dialog-title"></h2>
      <label class="field">
        <span class="field-label"></span>
        <input class="input" name="value" required maxlength="120" autocomplete="off">
      </label>
      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" value="cancel" data-dialog-close>Cancel</button>
        <button class="btn btn-primary" type="submit" value="confirm" data-dialog-confirm>Save</button>
      </div>
    </form>
  </dialog>
